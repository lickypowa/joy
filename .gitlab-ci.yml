stages:
  - validate
  - ios

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

validate:
  stage: validate
  image: node:24-bookworm
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test
    - npx expo config --type public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# EAS builds iOS on Expo's hosted macOS workers, so this job runs on Linux and
# does not require a Mac runner. Configure EXPO_TOKEN in GitLab CI/CD variables
# and initialize EAS credentials once (see eas.json / project setup).
ios_development_build:
  stage: ios
  when: manual
  image: node:24-bookworm
  script:
    - npm ci
    - test -n "$EXPO_TOKEN" || (echo "Set EXPO_TOKEN in GitLab CI/CD variables" && exit 1)
    - mkdir -p build
    - npx --yes eas-cli build --platform ios --profile development --non-interactive --json --wait > build/eas-build.json
    - BUILD_ID="$(node -e 'const r=JSON.parse(require("fs").readFileSync("build/eas-build.json", "utf8")); const b=Array.isArray(r)?r[0]:r; if (!b?.id) process.exit(1); process.stdout.write(b.id)')"
    - npx --yes eas-cli build:download --build-id "$BUILD_ID" --non-interactive --json
    - IPA_PATH="$(find . -maxdepth 2 -type f -name '*.ipa' -not -path './node_modules/*' -not -path './build/*' -print -quit)"
    - test -n "$IPA_PATH" || (echo "EAS completed, but no IPA was downloaded" && exit 1)
    - mv "$IPA_PATH" "build/JOY-$CI_COMMIT_SHORT_SHA.ipa"
  artifacts:
    name: "JOY-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/JOY-*.ipa
    expire_in: 14 days
    when: on_success
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

